version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: amasep-db
    environment:
      POSTGRES_DB: amasep
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: amasep-cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn backend.api_gateway.main:app --host 0.0.0.0 --port 8000 --reload
    container_name: amasep-gateway
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/amasep
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=super-secret-production-grade-jwt-signing-key-1337-amasep
      - SIMULATION_MODE=true
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  agent-orchestrator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn backend.orchestrator.main:app --host 0.0.0.0 --port 8001 --reload
    container_name: amasep-orchestrator
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/amasep
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SIMULATION_MODE=true
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  rag-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn backend.rag_service.main:app --host 0.0.0.0 --port 8002 --reload
    container_name: amasep-rag
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/amasep
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy

  sandbox:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn backend.sandbox.main:app --host 0.0.0.0 --port 8003 --reload
    container_name: amasep-sandbox
    ports:
      - "8003:8003"

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A backend.celery_app.celery_app worker --loglevel=info
    container_name: amasep-worker
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/amasep
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: amasep-ui
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway

  prometheus:
    image: prom/prometheus:latest
    container_name: amasep-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: amasep-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  postgres_data:
